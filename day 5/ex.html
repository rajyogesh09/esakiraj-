<!DOCTYPE html> 
<html> 
  <head> 
    <title>HTML Tables</title> 
    <style> 
      table { 
        border-collapse: collapse; 
        width: 70%; 
        margin: 20px auto; 
      } 
      th, td { 
        border: 2px solid #555; 
        padding: 10px; 
        text-align: center; 
      } 
      thead { 
        background-color: #add8e6; 
      } 
      tfoot { 
        background-color: #f9f9f9; 
        font-style: italic; 
      } 
    </style> 
  </head> 
  <body> 
 
    <h1>Movies Categories</h1> 
    <table> 
      <thead> 
        <tr> 
          <th>Movies</th> 
          <th >YEAR</th> 
          <th>GENRE</th>
        </tr> 
      </thead> 
      <tbody> 
        <tr> 
          <td>IRON MAN</td> 
          <td>2018</td> 
          <td>ACTION</td> 
        </tr> 
        <tr> 
          <td >Infinity War</td> 
          <td>2019</td> 
          <td>Comedy</td> 
        </tr> 
        <tr> 
          <td>thalapathy</td>
          <td>2026</td>
          <td> ACTION</td> 
        </tr> 
      </tbody> 
      <tfoot> 
        <tr> 
          <td colspan="3">all movies are rated by imdb</td> 
        </tr> 
      </tfoot> 
    </table> 
 
  </body> 
</html>
