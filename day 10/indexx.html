<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color: gray;
                height: 3000px;
                margin: 0px;
            }
#fixed{
    height: 200px;
    width: 200px;
    color: black;
    font-size: 18px;
    background-color: darkred;
    position: fixed;
    top: 0px;
    left: 0px;
    z-index: 3;
}
#relative{
    height: 200px;
    width: 200px;
    border: 4px solid black;
    color: black;
    font-size: 18px;
    background-color: yellow;
    position: relative;
    top: 100px;
    left: 0px;
    z-index: 2;
}
.container{
    height: 400px;
    width: 300px;
    color: black;
    font-size: 18px;
    background-color: lightblue;
    position: relative;
}
#absolute{
    height: 200px;
    width: 200px;
    color: black;
      border: 4px solid black;
    font-size: 18px;
    background-color: gold;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1;
}


        </style>
    </head>
    <body style="display: flex; flex-direction:row">
        <div class="box" id="fixed">1-FIXED POSITION</div>
        <div class="box" id="relative" >2-RELATIVE POSITION</div>
        <div class="container"> CONTAINER
        <div class="box" id="absolute">3-ABSOLUTE POSITION</div>
    </body>
</html>
