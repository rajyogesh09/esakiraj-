<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
            body{
                height: 200vh;
                margin-top: 100px;
                display: flex;
                flex-direction: column;
                align-items: center;
                
            }
.fixed{

    position:fixed;
    top: 0px;
    left: 0px;
    height: 110px;
    width: 100%;
    border: 2px solid black;
    background-color: darkslateblue;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 30px;
    color: white;
    margin: 0%;
    z-index: 999;
}
.relative{
    position: relative;
    top: 100px;
    height: 200px;
    width: 300px;
    border: 2px solid black;
    font-size: 20px;
    background-color: khaki;
    z-index: 1;
    border-radius: 12px;
    padding: 15px;
}
.absolute{
    position: absolute;
    bottom:  20px;
    right:  20px;
    background-color: darkgray;
    color: rgb(29, 4, 4);
    font-weight: bold;
    border-radius: 5px;
    width: 80px;
    height: 30px;
    cursor: pointer;
}


        </style>
    </head>
    <body>
       <header>
            <h1 class="fixed" id="fixed"> THE NAVIGATION BAR FIXED AT TOP</h1> </header>
            <div class="relative"> THE RELATIVE  <br> <br>
                <p class="para"> the click me button is absolute </p>
<button class="absolute"> click me </button>
            </div>
            

    </body>
</html>
